name: Release desktop installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v0.1.15'
        required: true
        type: string
      publish:
        description: 'Publish the release after all assets upload'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  # Keep CI on the same supported major/minor line declared by the app.
  NODE_VERSION: '20.19.3'
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  verify:
    name: Verify source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            notus/package-lock.json
      - name: Install root dependencies
        run: npm ci
      - name: Install web dependencies
        run: npm --prefix notus ci
      - name: Check release version alignment
        shell: bash
        run: |
          node -e "const root = require('./package.json').version; const web = require('./notus/package.json').version; const expected = process.env.RELEASE_TAG.replace(/^v/, ''); if (root !== web || root !== expected) { console.error({ root, web, expected }); process.exit(1); }"
      - name: Lint web app
        run: npm run lint:web
      - name: Run web test suite
        run: npm run test:all

  build:
    name: Build ${{ matrix.label }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: mac-x64
            label: macOS Intel (x64)
            runner: macos-15-intel
            script: dist:desktop:mac:x64
            asset: Notus-mac-x64.dmg
          - id: mac-arm64
            label: macOS Apple Silicon (arm64)
            runner: macos-15
            script: dist:desktop:mac:arm64
            asset: Notus-mac-arm64.dmg
          - id: win-x64
            label: Windows x64
            runner: windows-2025
            script: dist:desktop:win:x64
            asset: Notus-win-x64-setup.exe
          - id: win-arm64
            label: Windows ARM64
            runner: windows-11-arm
            script: dist:desktop:win:arm64
            asset: Notus-win-arm64-setup.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            notus/package-lock.json
      - name: Install root dependencies
        run: npm ci
      - name: Install web dependencies
        run: npm --prefix notus ci
      - name: Configure Windows ARM64 compiler
        if: matrix.id == 'win-arm64'
        shell: pwsh
        run: |
          $vswhere = (Get-Command vswhere.exe -ErrorAction Stop).Source
          $installationPath = (& $vswhere -latest -products * -property installationPath | Select-Object -First 1).Trim()
          if (-not $installationPath) {
            throw 'Visual Studio installation was not found on the Windows ARM64 runner.'
          }
          $devCmd = Join-Path $installationPath 'Common7\Tools\VsDevCmd.bat'
          if (-not (Test-Path $devCmd)) {
            throw "Visual Studio developer command script is missing: $devCmd"
          }
          $environmentLines = & cmd.exe /d /s /c "`"$devCmd`" -no_logo -arch=arm64 -host_arch=arm64 && set"
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to initialize the Windows ARM64 Visual Studio compiler environment.'
          }
          $targetArchitecture = ($environmentLines | Where-Object { $_ -like 'VSCMD_ARG_TGT_ARCH=*' } | Select-Object -First 1) -replace '^VSCMD_ARG_TGT_ARCH=', ''
          if ($targetArchitecture -ne 'arm64') {
            throw "Visual Studio did not select an ARM64 target compiler: $targetArchitecture"
          }
          $environmentLines | ForEach-Object {
            if ($_ -match '^(?<name>[^=]+)=(?<value>.*)$') {
              if ($matches.name -notmatch '^(GITHUB_|RUNNER_|ACTIONS_)') {
                "$($matches.name)=$($matches.value)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              }
            }
          }
      - name: Build installer
        run: npm run ${{ matrix.script }}
      - name: Verify named installer
        shell: bash
        run: test -f "desktop/dist/${{ matrix.asset }}"
      - name: Upload installer for release assembly
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-${{ matrix.id }}
          path: desktop/dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      SHOULD_PUBLISH: ${{ github.event_name == 'push' || github.event.inputs.publish == 'true' }}
    steps:
      - name: Download desktop installers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets
          pattern: desktop-*
          merge-multiple: true
      - name: Create checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum Notus-* > SHA256SUMS.txt
      - name: Create or update draft release with GitHub CLI
        shell: bash
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --draft \
              --title "Notus $RELEASE_TAG" \
              --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          if [ "$SHOULD_PUBLISH" = "true" ]; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          fi
